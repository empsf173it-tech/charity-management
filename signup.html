<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer Registration - KindHeart</title>
    <meta name="description" content="Register an account with KindHeart to start volunteering, tracking campaigns, and managing donations.">
    <!-- Bootstrap 5 CSS -->
    <link id="bootstrap-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" href="assets/img/favicon.png" type="image/png">
</head>
<body>

    <!-- Top Right Utilities -->
    <div class="position-absolute top-0 end-0 p-3 d-flex gap-2 z-3">
        <!-- Theme Toggle -->
        <button class="btn btn-outline-secondary btn-sm" id="themeToggle" aria-label="Toggle theme" style="width: 40px; height: 40px; border-radius: 50%; padding: 0; display: inline-flex; align-items: center; justify-content: center;">
            <i id="themeIcon" class="bi bi-moon-fill fs-5"></i>
        </button>
        <!-- RTL Toggle -->
        <button class="btn btn-outline-secondary btn-sm" id="rtlToggle" style="width: 40px; height: 40px; border-radius: 50%; padding: 0; display: inline-flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: bold;">RTL</button>
    </div>
    <!-- Signup Area -->
    <section class="py-5 bg-light-subtle min-vh-100 d-flex flex-column justify-content-center">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-6 col-md-8">
                    <div class="card p-4 p-md-5 custom-card">
                        <div class="text-center mb-4">
                            <a href="index.html" class="d-inline-flex align-items-center justify-content-center text-decoration-none mb-4">
                                <img src="assets/img/favicon.png" alt="KindHeart Logo" width="36" height="36" class="me-2">
                                <span class="fw-bold fs-3" style="color: var(--color-primary);">KindHeart</span>
                            </a>
                            <h2 class="fw-bold" style="color: var(--color-tertiary);">Join as Volunteer</h2>
                            <p class="text-muted">Register to start managing programs and tracking impact</p>
                        </div>
                        
                        <form class="needs-validation" novalidate>
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="firstName" class="form-label fw-semibold">First Name</label>
                                    <input type="text" class="form-control" id="firstName" required placeholder="John">
                                    <div class="invalid-feedback">First name is required.</div>
                                </div>
                                <div class="col-md-6">
                                    <label for="lastName" class="form-label fw-semibold">Last Name</label>
                                    <input type="text" class="form-control" id="lastName" required placeholder="Doe">
                                    <div class="invalid-feedback">Last name is required.</div>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="signupEmail" class="form-label fw-semibold">Email Address</label>
                                <input type="email" class="form-control" id="signupEmail" required placeholder="name@example.com">
                                <div class="invalid-feedback">Please enter a valid email.</div>
                            </div>
                            <div class="mb-3">
                                <label for="signupPassword" class="form-label fw-semibold">Password</label>
                                <input type="password" class="form-control" id="signupPassword" required placeholder="••••••••" minlength="8">
                                <div class="invalid-feedback">Password must be at least 8 characters.</div>
                            </div>
                            <div class="mb-4 form-check">
                                <input type="checkbox" class="form-check-input" id="termsCheck" required>
                                <label class="form-check-label text-muted small" for="termsCheck">I agree to the <a href="#" class="text-decoration-none" style="color: var(--color-primary);">Terms of Service</a> & Privacy Policy</label>
                                <div class="invalid-feedback">You must agree before submitting.</div>
                            </div>
                            <button type="submit" class="btn btn-custom-primary w-100 mb-3">Create Account</button>
                        </form>
                        
                        <div class="text-center my-3 text-muted small">Or sign up with</div>
                        
                        <!-- Social Logins (Rule 8: social login icons) -->
                        <div class="d-flex justify-content-center gap-3 mb-4">
                            <button class="btn-social-icon google" aria-label="Sign up with Google">
                                <i class="bi bi-google"></i>
                            </button>
                            <button class="btn-social-icon facebook" aria-label="Sign up with Facebook">
                                <i class="bi bi-facebook"></i>
                            </button>
                            <button class="btn-social-icon apple" aria-label="Sign up with Apple">
                                <i class="bi bi-apple"></i>
                            </button>
                        </div>
                        
                        <div class="text-center small text-muted">
                            Already have an account? <a href="login.html" class="fw-semibold text-decoration-none" style="color: var(--color-primary);">Sign In</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>



    <!-- Back to top button -->
    <button type="button" class="btn btn-custom-primary btn-lg shadow" id="backToTop" aria-label="Back to top">
        <i class="bi bi-arrow-up"></i>
    </button>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="assets/js/main.js"></script>
</body>
</html>
