<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Login - KindHeart</title>
    <meta name="description" content="Access your KindHeart donor profile to track monthly contributions, volunteer registrations, and projects impact.">
    <!-- Bootstrap 5 CSS -->
    <link id="bootstrap-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" href="assets/img/favicon.png" type="image/png">
</head>
<body>

    <!-- Top Right Utilities -->
    <div class="position-absolute top-0 end-0 p-3 d-flex gap-2 z-3">
        <!-- Theme Toggle -->
        <button class="btn btn-outline-secondary btn-sm" id="themeToggle" aria-label="Toggle theme" style="width: 40px; height: 40px; border-radius: 50%; padding: 0; display: inline-flex; align-items: center; justify-content: center;">
            <i id="themeIcon" class="bi bi-moon-fill fs-5"></i>
        </button>
        <!-- RTL Toggle -->
        <button class="btn btn-outline-secondary btn-sm" id="rtlToggle" style="width: 40px; height: 40px; border-radius: 50%; padding: 0; display: inline-flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: bold;">RTL</button>
    </div>
    <!-- Login Area -->
    <section class="py-5 bg-light-subtle min-vh-100 d-flex flex-column justify-content-center">
        <div class="container">
            <div class="row justify-content-center mt-5 mt-md-0">
                <div class="col-lg-5 col-md-8">
                    <div class="card p-4 p-md-5 custom-card">
                        <div class="text-center mb-4">
                            <a href="index.html" class="d-inline-flex align-items-center justify-content-center text-decoration-none mb-4">
                                <img src="assets/img/favicon.png" alt="KindHeart Logo" width="36" height="36" class="me-2">
                                <span class="fw-bold fs-3" style="color: var(--color-primary);">KindHeart</span>
                            </a>
                            <h2 class="fw-bold" style="color: var(--color-tertiary);">Welcome Back</h2>
                            <p class="text-muted">Enter details to access your account</p>
                        </div>
                        
                        <form class="needs-validation" novalidate>
                            <div class="mb-3">
                                <label for="loginEmail" class="form-label fw-semibold">Email Address</label>
                                <input type="email" class="form-control" id="loginEmail" required placeholder="name@example.com">
                                <div class="invalid-feedback">Please enter a valid email.</div>
                            </div>
                            <div class="mb-3">
                                <label for="loginPassword" class="form-label fw-semibold">Password</label>
                                <input type="password" class="form-control" id="loginPassword" required placeholder="••••••••">
                                <div class="invalid-feedback">Please enter your password.</div>
                                <div class="text-end mt-1">
                                    <a href="javascript:void(0)" class="small text-decoration-none" style="color: var(--color-primary);">Forgot Password?</a>
                                </div>
                            </div>
                            <div class="mb-4 form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe">
                                <label class="form-check-label text-muted small" for="rememberMe">Remember me</label>
                            </div>
                            <button type="submit" class="btn btn-custom-primary w-100 mb-3">Sign In</button>
                        </form>
                        
                        <div class="text-center my-3 text-muted small">Or continue with</div>
                        
                        <!-- Social Logins (Rule 8: social login icons) -->
                        <div class="d-flex justify-content-center gap-3 mb-4">
                            <button class="btn-social-icon google" aria-label="Sign in with Google">
                                <i class="bi bi-google"></i>
                            </button>
                            <button class="btn-social-icon facebook" aria-label="Sign in with Facebook">
                                <i class="bi bi-facebook"></i>
                            </button>
                            <button class="btn-social-icon apple" aria-label="Sign in with Apple">
                                <i class="bi bi-apple"></i>
                            </button>
                        </div>
                        
                        <div class="text-center small text-muted">
                            Don't have an account? <a href="signup.html" class="fw-semibold text-decoration-none" style="color: var(--color-primary);">Create Account</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>



    <!-- Back to top button -->
    <button type="button" class="btn btn-custom-primary btn-lg shadow" id="backToTop" aria-label="Back to top">
        <i class="bi bi-arrow-up"></i>
    </button>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="assets/js/main.js"></script>
</body>
</html>
